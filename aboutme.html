<!DOCTYPE html> <!--Defining the document type as HTML5 code-->
<html lang="en"> <!--Setting the language as English-->
<head> <!--Opening tag for head section-->
    <meta charset="UTF-8"> <!--Setting the character encoding to UTF-8 (common, standard)-->
    <title>About Me</title> <!--Setting my webpage title to "About Me", as it will show in the url bar-->
    <link rel="stylesheet" href="style.css"> <!--Linking to the CSS stylesheet, where I will be designing my webpage-->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Connecting to Google Fonts for custom fonts that are preloaded-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">     
</head>

<body> <!--Opening tag for body section, where user will see webpage content-->
    <div id="wrapper">
    <header> <!--Opening tag for header section, because this -->
        <img src="aboutme.jpg" alt="About Me"> <!--Displaying an image of the author, CODE FROM https://www.w3schools.com/html/html_images.asp-->
        <h1>About Me!</h1> <!--Setting main heading (h1 is the largest heading) as "About Me!"-->
        <p>Hi, I'm Mikayla! I am currently a second-year Technology Management (BIT) Student at Ontario Tech University. I have a strong interest in technology and business. </p> <!--Setting paragraph text-->
        <nav> <!--Opening tag for navigation section, which will link to the other pages-->
            <a href="index.html">Home</a> | <!--Link to Home page-->
            <a href="projectspage.html">Projects | </a> <!--Link to Projects page-->
            <a href="contactme.html">Contact Me | </a> <!--Link to Contact Me page-->
        </nav> <!--Closing tag for navigation section-->
    </header>
    
    <main> <!--Opening tag for main section, where the main content of the webpage will be-->
        <video width="320" height="240" controls poster="aboutme.png"> <!--Opening tag for video element-->
            <source src="aboutme.mp4" type="video/mp4"> <!--Specifying the video file in MP4 format-->
            <source src="aboutme.ogv" type="video/ogg"> <!--Specifying the video file in OGG format-->
            Your browser does not support the video tag.
        </video>
    </main>

    <div class="clear"> <!--this clears all prior formatting for whatever elements are within the float class, if any-->
        <footer>
            <h5>© Site by Mikayla Rojas | mikayla.rojas@ontariotechu.net</h5>
        </footer> <!--closing the "footer" div-->
    </div>
    </div>
</body> <!--Closing tag for body section-->
</html> <!--Closing tag for html section-->
