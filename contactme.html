<!DOCTYPE html> <!--Defining the document type as HTML5 code-->
<html lang="en"> <!--Setting the language as English-->
<head> <!--Opening tag for head section-->
    <meta charset="UTF-8"> <!--Setting the character encoding to UTF-8 (common, standard)-->
    <title>Contact Me</title> <!--Setting my webpage title to "Contact Me", as it will show in the url bar-->
    <link rel="stylesheet" href="style.css"> <!--Linking to the CSS stylesheet, where I will be designing my webpage-->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Connecting to Google Fonts for custom fonts that are preloaded-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">     
</head>

<body>
    <header>
        <h1>Contact Me</h1>
        <nav> <!--Opening tag for navigation section, which will link to the other pages-->
            <a href="index.html">Home</a> <!--Link to Home page-->
            <a href="aboutme.html">About Me</a> <!--Link to About Me page-->
            <a href="projectspage.html">Projects</a> <!--Link to Projects page-->
        </nav> <!--Closing tag for navigation section-->
    </header>
    <main>
        <div id="keepintouch">
            <h2>Keep in touch!</h2> <!--using h2 because its smaller than h1-->
        </div>
        <form action="mailto:mikayla.rojas@ontariotechu.net" method="post" enctype="text/plain" name="form">
            <p>
                <label for="name">Name:</label>
                <input type="text" name="name" size="32" id="name" required placeholder="Your name here">
            </p>
            <p>
                <label for="email">Email:</label>
                <input name="email" type="email" size="40" id="email" required placeholder="youremail@example.com">
            </p>
            <p>
                <label for ="phone">Phone number:</label> <!--ask how to do phone VALIDATION-->
                <input name="phone" type="tel" id="phone" required placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"> <!--pattern from https://www.w3schools.com/tags/att_input_type_tel.asp-->
            </p>
            <p>
                <label for="comments">Comments?</label><br>
                <textarea name="comments" cols="60" rows="6" id="comments" placeholder="Share any of your thoughts here!"></textarea>
            </p>
            <p><input type="submit" value="Click here to submit the form"></p>
        </form>
    </main>
        
    <div class="clear"> <!--this clears all prior formatting for whatever elements are within the float class-->
            <footer>
                <h5>© Site by Mikayla Rojas | mikayla.rojas@ontariotechu.net</h5>
            </footer> <!--closing the "footer" div-->
    </div>
</body>
</html>
