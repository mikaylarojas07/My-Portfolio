<!DOCTYPE html> <!--Defining the document type as HTML5 code-->
<html lang="en"> <!--Setting the page's language as English-->
<head> <!--Opening tag for head section (non visible page content)-->
    <meta charset="UTF-8"> <!--Setting the character encoding to UTF-8 (so that special characters will display correctly)-->
    <title>My Portfolio</title> <!--Setting my webpage title to "My Portfolio", as it will show in the browser tab-->
    <meta name="viewport" content="width=device-width"> <!--Makes the page layout match the device's screen width-->
    <!--style sheet is for full-size monitors (960px and up)-->
    <link href="style.css" rel="stylesheet" type="text/css" media="only screen and (min-width:960px)"> <!--Breakpoint: 960 and up (decimal-width strategy to avoid gaps adapted from https://stevefenton.co.uk/blog/2023/05/unintentional-media-query-gaps/)-->
    <!--style sheet is for tablet screen (481px to 959.9px)-->
    <link href="tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width:481px) and (max-width:959.9px)"> <!--Breakpoint: 481 - 959.9. Stops just below 960 to avoid overlap with style.css-->
    <!--style sheet is for smartphone screens (480.9px and narrower)-->
    <link href="mobile.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480.9px)"> <!--Breakpoint: 0 - 480.9. Stops just under 481 so it never overlaps with tablet.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Connecting to Google Fonts for custom fonts that load faster-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">        
</head> <!--Closing tag for head section-->

<body> <!--Opening tag for body section, where user will SEE webpage content-->
    <div id="wrapper"> <!--Opening tag for the container div I named "wrapper", where page content will appear-->
    <header id="gradient-background"> <!--Unique header id because I want a gradient background only on this header, not on the others-->
        <h1>Mikayla Rojas</h1> <!--Setting main heading (h1 is the largest heading) as "Mikayla Rojas"-->
        <nav> <!--Opening tag for navigation section, which will link to the other pages in my portfolio-->
            <a href="aboutme.html">About</a><!--Link to About Me page-->
            <a href="projectspage.html">Projects</a><!--Link to Projects page-->
            <a href="contactme.html">Contact</a><!--Link to Contact Me page-->
        </nav> <!--Closing tag for navigation section-->
    </header> <!--Closing tag for header section-->
    <div class="clear"> <!--Div with the class "clear"; this removes any existing float attributes for the <footer>-->
        <footer id="homepage-footer"> <!--Unique footer id because I want my gradient only on this footer, not on the others-->
            <p> <!--Setting my footer text as paragraph text-->
                © 2026 | Site by Mikayla Rojas <!--Footer content: copyright information with year, and author's name (me)-->
            </p> <!--Closing tag for paragraph content-->
            <address> <!--Address element is used to indicate that my email address is an address type for SEO-->
                <p><a href="mailto:mikayla.rojas@ontariotechu.net">mikayla.rojas@ontariotechu.net</a></p> <!--Linking my email address so that it is a clickable link-->
            </address> <!--Closing tag for address-->
        </footer> <!--Closing tag for footer section-->
    </div> <!--Closing tag for "clear" div-->
    </div> <!--Closing tag for "wrapper" div-->
</body> <!--Closing tag for body section-->
</html> <!--Closing tag for html section-->
